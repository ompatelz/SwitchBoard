name: switchboard

x-switchboard-service: &switchboard-service
  image: switchboard:phase-0
  init: true
  restart: "no"

services:
  mock-provider:
    <<: *switchboard-service
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      - uvicorn
      - switchboard.mock_provider:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2).read()
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  gateway:
    <<: *switchboard-service
    command:
      - uvicorn
      - switchboard.gateway:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      SWITCHBOARD_MOCK_PROVIDER_URL: http://mock-provider:8001
      SWITCHBOARD_UPSTREAM_CONNECT_TIMEOUT_SECONDS: "2.0"
      SWITCHBOARD_UPSTREAM_READ_TIMEOUT_SECONDS: "10.0"
      SWITCHBOARD_UPSTREAM_WRITE_TIMEOUT_SECONDS: "2.0"
      SWITCHBOARD_UPSTREAM_POOL_TIMEOUT_SECONDS: "1.0"
    depends_on:
      mock-provider:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
