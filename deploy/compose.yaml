name: switchboard

x-switchboard-service: &switchboard-service
  image: switchboard:phase-1
  init: true
  restart: "no"

services:
  mock-provider:
    <<: *switchboard-service
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      - uvicorn
      - switchboard.mock_provider:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2).read()
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  gateway:
    <<: *switchboard-service
    command:
      - uvicorn
      - switchboard.gateway:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      SWITCHBOARD_MOCK_PROVIDER_URL: http://mock-provider:8001
      SWITCHBOARD_REDIS_URL: redis://redis:6379/0
      SWITCHBOARD_TENANT_KEY_HASHES_JSON: ${SWITCHBOARD_TENANT_KEY_HASHES_JSON:?Set tenant key hashes before starting Compose}
      SWITCHBOARD_RATE_LIMIT_REQUESTS: ${SWITCHBOARD_RATE_LIMIT_REQUESTS:-120}
      SWITCHBOARD_UPSTREAM_CONNECT_TIMEOUT_SECONDS: "2.0"
      SWITCHBOARD_UPSTREAM_READ_TIMEOUT_SECONDS: "10.0"
      SWITCHBOARD_UPSTREAM_WRITE_TIMEOUT_SECONDS: "2.0"
      SWITCHBOARD_UPSTREAM_POOL_TIMEOUT_SECONDS: "1.0"
    depends_on:
      mock-provider:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  gateway-uncached:
    <<: *switchboard-service
    profiles: [benchmark]
    command:
      - uvicorn
      - switchboard.gateway:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      SWITCHBOARD_MOCK_PROVIDER_URL: http://mock-provider:8001
      SWITCHBOARD_SECONDARY_MOCK_PROVIDER_URL: http://mock-provider:8001
      SWITCHBOARD_REDIS_URL: redis://redis:6379/0
      SWITCHBOARD_TENANT_KEY_HASHES_JSON: ${SWITCHBOARD_TENANT_KEY_HASHES_JSON:?Set tenant key hashes before starting Compose}
      SWITCHBOARD_RATE_LIMIT_REQUESTS: ${SWITCHBOARD_RATE_LIMIT_REQUESTS:-120}
    depends_on:
      mock-provider:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    restart: "no"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  embedding-worker:
    image: switchboard-embedding:guarded
    init: true
    restart: "no"
    profiles: [embedding]
    build:
      context: ..
      dockerfile: deploy/embedder.Dockerfile
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8003/readyz', timeout=3).read()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
